version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: weathergpt
      POSTGRES_PASSWORD: weathergpt
      POSTGRES_DB: weathergpt
    ports:
      - "5432:5432"
    volumes:
      - weathergpt_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  weathergpt:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://weathergpt:weathergpt@postgres:5432/weathergpt
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  weathergpt_pgdata:
